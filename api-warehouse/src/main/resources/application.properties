spring.application.name=api-warehouse
server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_WAREHOUSE_NAME}
spring.datasource.username=${POSTGRES_WAREHOUSE_USER}
spring.datasource.password=${POSTGRES_WAREHOUSE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info,beans
management.info.env.enabled=true
